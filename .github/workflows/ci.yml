name: CI & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit – shipped code (moderate+ blocks)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Dependency audit – full tree incl. dev tools (report, high+ blocks)
        run: |
          mkdir -p audit
          npm audit --json > audit/npm-audit-full.json || true
          npm audit --omit=dev --json > audit/npm-audit-prod.json || true
          npm audit --audit-level=high
      - name: Lint (ESLint + i18n hard-coded string check)
        run: npm run lint
      - name: Type-check (strict)
        run: npm run typecheck
      - name: Unit + integration tests
        run: npm test
      - name: Build + bundle budget (≤ 350 KB gzip initial route)
        run: npm run build
      - name: Install Playwright browsers (Chromium + WebKit/Safari engine)
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end tests (iPhone viewport, desktop, WebKit)
        run: npx playwright test
        env:
          CI: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results/screens
            audit
          retention-days: 14
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
