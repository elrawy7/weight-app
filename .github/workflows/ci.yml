name: CI & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit (shipped code, high+ blocks)
        run: npm audit --omit=dev --audit-level=high
      - name: Lint (ESLint + i18n hard-coded string check)
        run: npm run lint
      - name: Type-check (strict)
        run: npm run typecheck
      - name: Unit + integration tests
        run: npm test
      - name: Build + bundle budget (≤ 350 KB gzip initial route)
        run: npm run build
      - name: Install Playwright browsers (Chromium + WebKit/Safari engine)
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end tests (iPhone viewport, desktop, WebKit)
        run: npx playwright test
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results/screens
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
